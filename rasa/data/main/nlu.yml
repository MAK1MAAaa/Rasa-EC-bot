version: "3.1"

nlu:
  - intent: greet
    examples: |
      - 你好
      - 您好
      - 在吗
      - 客服你好
      - hello
      - hi

  - intent: goodbye
    examples: |
      - 再见
      - 拜拜
      - 先这样
      - 不用了
      - 下次再聊

  - intent: thanks
    examples: |
      - 谢谢
      - 多谢
      - 感谢你
      - 辛苦了
      - 你帮大忙了

  - intent: bot_challenge
    examples: |
      - 你是机器人吗
      - 你是谁
      - 你是人工客服吗
      - 这是自动客服吗
      - 你是真人还是系统

  - intent: ask_order_help
    examples: |
      - 我想查订单
      - 帮我看看我的订单状态
      - 查询我的订单
      - 列出我最近的订单
      - 看看我账号下有什么订单
      - 帮我查一下订单 ORD202603300001
      - 订单 ORD202603300001 现在是什么状态
      - 我有哪几个订单还没处理
      - 最近的订单进度帮我看下

  - intent: ask_shipping_help
    examples: |
      - 帮我查物流
      - 物流到哪里了
      - 快递什么时候到
      - 订单配送进度
      - 看下我的包裹
      - 查询订单 ORD202603300002 的物流
      - 帮我看 ORD202603300002 现在到哪了
      - ORD202603300002 预计什么时候送到
      - 我的订单物流有更新吗

  - intent: ask_after_sales_help
    examples: |
      - 我想查售后进度
      - 帮我看下退货处理到哪一步了
      - 我的换货申请状态是什么
      - 售后在哪里看
      - 查询我的售后记录
      - 订单 ORD202603300001 的售后进度怎么样
      - 我之前提的退款处理好了没有
      - 帮我查一下最近的售后单
      - 我的退货申请审核到哪里了

  - intent: ask_product_recommendation
    examples: |
      - 推荐一些商品
      - 有什么值得买的
      - 给我推荐几款热门商品
      - 推荐一些[手机](category)
      - 我想看[电脑](category)推荐
      - 有没有[显示器](category)推荐
      - 想买个[耳机](category)有什么推荐
      - 预算三千左右推荐一台[手机](category)
      - 推荐几款适合办公的[显示器](category)
      - 我想买[电脑](category)，主要是剪视频
      - 有没有白色的[手机](category)推荐
      - 推荐适合宿舍用的[家电](category)

  - intent: ask_price_protection_policy
    examples: |
      - 平台支持保价吗
      - 如果活动后降价了可以补差价吗
      - 价格保护规则是什么
      - 买完之后降价怎么申请补差价
      - 你们的保价政策怎么走
      - 大促后降价能退差价吗
      - 订单降价之后可以申请价格保护吗
      - 有没有保价期限说明

  - intent: ask_manual_or_troubleshoot
    examples: |
      - 智能门锁怎么恢复出厂设置
      - 这个商品的说明书在哪里看
      - 显示器一直黑屏怎么排查
      - 耳机连不上蓝牙怎么办
      - 帮我看看净水器怎么安装
      - 相机报错是什么意思
      - 门铃离线了应该怎么处理
      - 扫地机卡住了怎么解决
      - 这款产品的使用说明有吗

  - intent: ask_product_comparison
    examples: |
      - 帮我比较一下 27 寸和 32 寸显示器
      - 256G 和 512G 哪个更适合我
      - 黑色和白色这两个版本有什么区别
      - 两款手机哪个拍照更好
      - 轻薄本和游戏本应该怎么选
      - 55L 背包和 35L 背包差别大吗
      - 你觉得 X1 Pro 和 X1 Ultra 哪个更值
      - 这两个门锁型号有什么区别

  - intent: ask_multi_intent_complex
    examples: |
      - 帮我查物流，顺便推荐一个同价位显示器
      - 我想看订单状态，然后再推荐几款手机
      - 查询我的售后记录，并告诉我保价规则
      - 推荐一台笔记本，再帮我看看最近订单
      - 我想查订单 ORD202603300001，然后问一下退货政策
      - 先看物流进度，再给我推荐几个耳机
      - 帮我看下包裹到哪了，另外说明书怎么下载

  - intent: ask_conditional_complex
    examples: |
      - 如果我主要打游戏和剪视频，应该选哪台电脑
      - 要是预算三千以内还想要长续航手机，怎么选
      - 如果显示器主要办公偶尔打游戏，27 寸还是 32 寸更合适
      - 颜色要白色而且尺寸不能太大，有什么推荐
      - 如果门锁离线后还想保留联动场景，应该怎么处理
      - 如果后面降价了还能保价吗
      - 既要轻薄又要性能，笔记本该怎么挑

  - intent: request_transactional_action
    examples: |
      - 帮我申请退款
      - 帮我申请退货
      - 给我发起换货
      - 帮我取消订单 ORD202603300001
      - 直接修改订单 ORD202603300001 的收货地址
      - 帮我投诉物流
      - 现在就给我下单
      - 帮我提交售后申请
      - 代我把地址改成北京海淀区中关村软件园
      - 直接帮我发起物流投诉

  - intent: chitchat
    examples: |
      - 最近有什么新鲜事
      - 我有点纠结买什么
      - 你觉得我该怎么选
      - 给我一点建议
      - 我今天有点拿不定主意
