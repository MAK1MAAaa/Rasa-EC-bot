base_model: Qwen/Qwen3.5-2B
train_file: data/processed/combined_react_agent/train.jsonl
eval_file: data/processed/combined_react_agent/val.jsonl
output_dir: outputs/smoke_combined_react

seed: 42
max_seq_len: 1024
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 800
logging_steps: 20
save_steps: 1000
eval_steps: 1000
max_eval_samples: 1000
save_total_limit: 2

bf16: true
fp16: false
gradient_checkpointing: true
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
optim: paged_adamw_8bit

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
