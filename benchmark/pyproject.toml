[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rasa-ec-bot-benchmark"
version = "0.1.0"
description = "Root benchmark engineering for Rasa-EC-bot"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "pandas>=2,<3",
]

[project.scripts]
benchmark-build = "benchmark.dataset:main"
benchmark-run = "benchmark.runner:main"
benchmark-analyze = "benchmark.reporting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
