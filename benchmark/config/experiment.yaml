seed: 20260412
timeout_sec: 60
warmup_requests: 1
results_dir: benchmark/results
image_assets_dir: benchmark/assets
image_case_map:
  damaged_package: damaged_package.png
  broken_screen: broken_screen.png
  wrong_item: wrong_item.png

knowledge_seed:
  index_path: /api/v1/kb/index
  documents:
    - source_type: policy
      title: Benchmark 售后政策知识
      path: benchmark/kb_seed/after_sales_policy.md
      version: benchmark-v1
      status: active
      metadata:
        suite: system_benchmark
    - source_type: manual
      title: Benchmark 商品说明书知识
      path: benchmark/kb_seed/product_manual.md
      version: benchmark-v1
      status: active
      metadata:
        suite: system_benchmark

profiles:
  quick:
    dataset_tier: core
    selection_mode: sampled
    scenarios:
      - recommendation
      - order_query
      - logistics_query
      - after_sales_query
      - knowledge_and_multimodal
      - transactional_action
    concurrency: [1]
    requests_per_level: 1
    repeats: 1
  standard:
    dataset_tier: extended
    selection_mode: all_unique
    scenarios:
      - recommendation
      - order_query
      - logistics_query
      - after_sales_query
      - knowledge_and_multimodal
      - transactional_action
    concurrency: [1]
    requests_per_level: 6
    repeats: 1
  paper:
    dataset_tier: extended
    selection_mode: all_unique
    scenarios:
      - recommendation
      - order_query
      - logistics_query
      - after_sales_query
      - knowledge_and_multimodal
      - transactional_action
    concurrency: [1]
    requests_per_level: 6
    repeats: 2

auth:
  login_url: http://127.0.0.1:8000/api/v1/auth/login
  me_url: http://127.0.0.1:8000/api/v1/auth/me
  customer:
    email: test1@example.com
    password: password123
  merchant:
    email: merchant1@example.com
    password: password123

systems:
  rasa_only:
    kind: rasa_rest
    base_url: http://127.0.0.1:5006
    path: /webhooks/rest/webhook
    model: ""
    auth_mode: metadata
    sender_id: benchmark-rasa-only
    capabilities:
      supports_auth_queries: true
      supports_kb_policy: false
      supports_kb_manual: false
      supports_pending_action: false
      supports_pending_decision: false
      supports_attachments: false
      supports_image_analysis: false
      supports_cards: true
  rasa_plus_llm:
    kind: backend_chat
    base_url: http://127.0.0.1:8000
    path: /api/v1/chat/send
    upload_path: /api/v1/chat/upload-image
    pending_action_path: /api/v1/chat/pending-action/decision
    login_url: http://127.0.0.1:8000/api/v1/auth/login
    me_url: http://127.0.0.1:8000/api/v1/auth/me
    model: qwen3.5:2b
    auth_mode: bearer
    sender_id: benchmark-rasa-plus-llm
    capabilities:
      supports_auth_queries: true
      supports_kb_policy: true
      supports_kb_manual: true
      supports_pending_action: true
      supports_pending_decision: true
      supports_attachments: true
      supports_image_analysis: true
      supports_cards: true
  rasa_plus_lora_llm:
    kind: backend_chat
    base_url: http://127.0.0.1:8001
    path: /api/v1/chat/send
    upload_path: /api/v1/chat/upload-image
    pending_action_path: /api/v1/chat/pending-action/decision
    login_url: http://127.0.0.1:8001/api/v1/auth/login
    me_url: http://127.0.0.1:8001/api/v1/auth/me
    model: qwen3.5:2b-lora
    auth_mode: bearer
    sender_id: benchmark-rasa-plus-lora-llm
    capabilities:
      supports_auth_queries: true
      supports_kb_policy: true
      supports_kb_manual: true
      supports_pending_action: true
      supports_pending_decision: true
      supports_attachments: true
      supports_image_analysis: true
      supports_cards: true
