name: rasa-ec-bot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rasa-ec-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rasa_ec_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./backend/db/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: rasa-ec-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rasa-ec-backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rasa_ec_bot}
      REDIS_URL: redis://redis:6379/0
      RASA_SERVER_URL: http://rasa-server:5005
      RASA_REST_WEBHOOK_PATH: /webhooks/rest/webhook
      RASA_PARSE_PATH: /model/parse
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rasa-actions:
    build:
      context: ./rasa
      dockerfile: Dockerfile
    container_name: rasa-ec-actions
    command: ["uv", "run", "rasa", "run", "actions", "--actions", "actions", "--port", "5055"]
    env_file:
      - path: ./rasa/.env
        required: false
      - path: ./.env.docker
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      BACKEND_API_URL: http://backend:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${RASA_ACTION_PORT:-5055}:5055"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  rasa-server:
    build:
      context: ./rasa
      dockerfile: Dockerfile
    container_name: rasa-ec-server
    command:
      - uv
      - run
      - rasa
      - run
      - --enable-api
      - --cors
      - "*"
      - --credentials
      - credentials.yml
      - --endpoints
      - endpoints.docker.yml
      - --model
      - models
      - --interface
      - 0.0.0.0
      - --port
      - "5005"
    ports:
      - "${RASA_PORT:-5005}:5005"
    depends_on:
      rasa-actions:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/status', timeout=5).read()\""]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rasa-ec-frontend
    env_file:
      - path: ./frontend/.env
        required: false
      - path: ./.env.docker
        required: false
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      rasa-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
